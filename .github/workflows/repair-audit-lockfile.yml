name: Repair audited lockfile

on:
  push:
    branches:
      - fix/react-review-findings
    paths:
      - .github/workflows/repair-audit-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply patched transitive resolutions
        run: |
          pnpm audit --fix=update || echo 'Trying targeted security overrides for remaining advisories.'
          pnpm audit --fix || echo 'Final audit will reject any remaining advisories.'
          pnpm install --lockfile-only
      - name: Verify lockfile and audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit
      - name: Commit the generated lockfile
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml pnpm-workspace.yaml
          if git diff --cached --quiet; then
            echo "No lockfile updates found." >&2
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(deps): resolve audited transitive dependency advisories"
          git push origin HEAD:fix/react-review-findings
