name: Repair Cloud Functions audit lockfile

on:
  push:
    branches:
      - fix/react-review-findings
    paths:
      - .github/workflows/repair-functions-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Repair and re-audit Functions
        run: |
          npm --prefix functions audit fix --package-lock-only --ignore-scripts
          npm --prefix functions audit --package-lock-only --ignore-scripts
      - name: Commit patched lockfile
        run: |
          set -euo pipefail
          git add functions/package-lock.json
          if git diff --cached --quiet; then
            echo "Audit found no lockfile updates" >&2
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(deps): patch Cloud Functions body-parser dependency"
          git push origin HEAD:fix/react-review-findings
